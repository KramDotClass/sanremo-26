<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Sanremo 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>La classifica cattiva di Marco il cattivone</h1>
            <nav>
                <a href="index.html" class="active">Classifica</a>
                <a href="voto.html">📺 Televoto</a>
                <a href="admin.html">Gestione Dati</a>
            </nav>
        </header>

        <main>
            <div class="tab-bar">
                <button class="tab-btn active" id="tabS1"       onclick="switchTab('s1')">🎭 Serate 1–3</button>
                <button class="tab-btn"         id="tabS2"       onclick="switchTab('s2')">🎸 Cover</button>
                <button class="tab-btn"         id="tabS3"       onclick="switchTab('s3')">🏆 Finale</button>
                <button class="tab-btn"         id="tabComments" onclick="switchTab('comments')">💬 Commenti</button>
            </div>

            <div id="panelS1">
                <div class="artists-grid ranking-grid" id="gridS1"><!-- dinamico --></div>
            </div>
            <div id="panelS2" style="display:none;">
                <div class="artists-grid ranking-grid" id="gridS2"><!-- dinamico --></div>
            </div>
            <div id="panelS3" style="display:none;">
                <div class="artists-grid ranking-grid" id="gridS3"><!-- dinamico --></div>
            </div>

            <div id="commentsPanel" style="display:none;">
                <div id="allCommentsContainer"><!-- dinamico --></div>
            </div>
        </main>
    </div>

    <!-- Modal per valutazione dettagliata -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody">
                <!-- Contenuto dinamico -->
            </div>
        </div>
    </div>

    <!-- Modal per visualizzazione immagine -->
    <div id="imageModal" class="modal image-modal">
        <div class="image-modal-content">
            <span class="close" onclick="closeImageModal()">&times;</span>
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <!-- Firebase SDK (sistema commenti) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
